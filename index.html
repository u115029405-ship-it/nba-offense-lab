<!DOCTYPE html>
<html lang="zh-Hant">

              <span class="text-xs font-medium text-[#F59E0B]">Dallas Mavericks · #11</span>
              <h3 class="text-xl font-bold mt-1 group-hover:text-[#F59E0B] transition-colors">Kyrie Irving</h3>
            </div>
            <span class="px-2.5 py-1 text-xs rounded-md bg-[#27272A] text-[#A1A1AA]">單打大師</span>
          </div>
          <p class="text-sm text-[#A1A1AA] leading-relaxed">
